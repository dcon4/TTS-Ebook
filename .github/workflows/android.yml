name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Use stable debug keystore
        shell: bash
        run: |
          if [ -n "$DEBUG_KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            echo "$DEBUG_KEYSTORE" | base64 -d > "$HOME/.android/debug.keystore"
            ls -l "$HOME/.android/debug.keystore"
            openssl pkcs12 -in "$HOME/.android/debug.keystore" -passin pass:android -nokeys 2>/dev/null \
              | openssl x509 -outform DER 2>/dev/null | sha256sum
            echo "Pinned keystore decoded OK"
          else
            echo "DEBUG_KEYSTORE secret not set - falling back to generated keystore"
          fi
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}

      - name: Print signing config
        run: ./gradlew :app:signingReport

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: List APK outputs
        run: find app/build/outputs -name "*.apk" -type f

      - name: Verify APK matches pinned debug keystore
        shell: bash
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          echo "Using: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/apk_certs.txt
          apk_digest=$(grep -i 'SHA-256 digest' /tmp/apk_certs.txt | head -1 | sed 's/.*: *//' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          echo "APK signing cert SHA-256: $apk_digest"
          if [ -z "$apk_digest" ]; then echo "NO APK SIGNING CERTIFICATE FOUND"; exit 1; fi
          if [ -n "$DEBUG_KEYSTORE" ]; then
            openssl pkcs12 -in "$HOME/.android/debug.keystore" -passin pass:android -nokeys 2>/dev/null \
              | openssl x509 -outform DER 2>/dev/null > /tmp/ks.der
            ks_digest=$(sha256sum /tmp/ks.der | cut -d' ' -f1)
            echo "Pinned keystore cert SHA-256: $ks_digest"
            if [ -z "$ks_digest" ]; then echo "COULD NOT READ PINNED KEYSTORE"; exit 1; fi
            if [ "$apk_digest" != "$ks_digest" ]; then
              echo "APK signature does not match pinned keystore"
              exit 1
            fi
            echo "APK signature matches pinned keystore"
          fi
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
